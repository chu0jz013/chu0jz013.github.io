<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>quachuoitrenmay</title>
    <script>
      // GitHub Pages serves this file for any path it has no file for, and it has
      // no SPA fallback. Bounce the path into the app as ?p=… so a deep link like
      // /happy-farm still resolves; index.tsx puts the pretty path back.
      location.replace(location.origin + "/?p=" + encodeURIComponent(location.pathname));
    </script>
  </head>
  <body></body>
</html>
